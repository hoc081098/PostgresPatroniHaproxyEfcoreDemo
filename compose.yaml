version: "3.9"

services:
  #  postgrespatronihaproxyefcoredemo:
  #    image: postgrespatronihaproxyefcoredemo
  #    build:
  #      context: .
  #      dockerfile: PostgresPatroniHaproxyEfcoreDemo/Dockerfile
  
  # ---------------------------------------- etcd ----------------------------------------

  # etcd for Patroni leader election
  # Sample: https://github.com/etcd-io/etcd/blob/11e4bce77075583d48b5e8273018f83ca196f784/tests/antithesis/config/docker-compose-3-node.yml
  etcd1:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: etcd1
    hostname: etcd1
    environment: &etcd1-env
      ETCD_NAME: etcd1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: postgres-ha-cluster
    networks: [ demo ]
    volumes:
      - pgsql_patroni_etcd_efcore_demo_etcd1_data:/etcd-data
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  etcd2:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: etcd2
    hostname: etcd2
    environment:
      <<: *etcd1-env
      ETCD_NAME: etcd2
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
    networks: [ demo ]
    volumes:
      - pgsql_patroni_etcd_efcore_demo_etcd2_data:/etcd-data
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  etcd3:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: etcd3
    hostname: etcd3
    environment:
      <<: *etcd1-env
      ETCD_NAME: etcd3
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
    networks: [ demo ]
    volumes:
      - pgsql_patroni_etcd_efcore_demo_etcd3_data:/etcd-data
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------- Patroni ----------------------------------------

  # Patroni node 1 (using Zalando Spilo)
  # Spilo = Patroni + PostgreSQL + WAL-G (backup) + extensions, pre-packaged by Zalando
  patroni1:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: patroni1
    hostname: patroni1
    # Backup Spilo's original /scripts/post_init.sh → .orig, then replace it with our wrapper,
    # so our wrapper can call the original first and then run app-specific init.
    entrypoint: &patroni-entrypoint >
      bash -c "
        if [ ! -f /scripts/post_init.sh.orig ] && [ -f /scripts/post_init.sh ]; then
          cp /scripts/post_init.sh /scripts/post_init.sh.orig;
        fi;
        cp /post_init_wrapper.sh /scripts/post_init.sh;
        chmod +x /scripts/post_init.sh;
        exec /launch.sh
      "
    environment: &patroni-env
      PATRONI_NAME: patroni1
      SCOPE: postgres-ha # cluster name, multiple Spilos belonging to the same cluster must have identical scope.
      ETCD3_HOSTS: '"etcd1:2379","etcd2:2379","etcd3:2379"' # list of Etcd hosts in format '"host1:port1","host2:port2",...,"hostN:portN"'.
      SPILO_PROVIDER: 'local' # https://github.com/zalando/spilo/blob/84ab3860ddbaca5b18dfe8e2b6c124c9d5273ca9/postgres-appliance/scripts/configure_spilo.py#L398
      SPILO_CONFIGURATION: |
        postgresql:
          remove_data_directory_on_rewind_failure: true
          remove_data_directory_on_diverged_timelines: true
      PGUSER_SUPERUSER: postgres           # superuser for Patroni management (default)
      PGPASSWORD_SUPERUSER: postgres_pass  # superuser password
      PGUSER_STANDBY: standby              # replication user
      PGPASSWORD_STANDBY: standby_pass     # replication user password
      # Application database & user (created via post_init.sh, similar to POSTGRES_DB/POSTGRES_USER in official postgres image)
      # These are not used by Patroni itself, but they are used in "./patroni/post_init.sh"
      APP_DB: app_db
      APP_USER: app_user
      APP_PASSWORD: app_pass
    networks: [ demo ]
    depends_on: [ etcd1, etcd2, etcd3 ]
    volumes:
      - pgsql_patroni_etcd_efcore_demo_patroni1_data:/home/postgres/pgdata
      - ./patroni/post_init_wrapper.sh:/post_init_wrapper.sh:ro  # mounted to a staging path, not directly overriding Spilo's script

  # Patroni node 2 (using Zalando Spilo)
  patroni2:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: patroni2
    hostname: patroni2
    entrypoint: *patroni-entrypoint
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni2
    networks: [ demo ]
    depends_on: [ etcd1, etcd2, etcd3 ]
    volumes:
      - pgsql_patroni_etcd_efcore_demo_patroni2_data:/home/postgres/pgdata
      - ./patroni/post_init_wrapper.sh:/post_init_wrapper.sh:ro

  # Patroni node 3 (using Zalando Spilo)
  patroni3:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: patroni3
    hostname: patroni3
    entrypoint: *patroni-entrypoint
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni3
    networks: [ demo ]
    depends_on: [ etcd1, etcd2, etcd3 ]
    volumes:
      - pgsql_patroni_etcd_efcore_demo_patroni3_data:/home/postgres/pgdata
      - ./patroni/post_init_wrapper.sh:/post_init_wrapper.sh:ro
  
  # ----------------------------------------- HAProxy ----------------------------------------
  haproxy1:
    image: haproxy:2.8.18
    container_name: haproxy1
    hostname: haproxy1
    networks: [ demo ]
    depends_on: [ patroni1, patroni2, patroni3 ]
    volumes:
      # Mount your local haproxy.cfg file into the container's default config path
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5000:5000" # PostgreSQL primary (read-write) → postgres_primary_backend
      - "5001:5001" # PostgreSQL replicas (read-only) → postgres_replicas_backend
      - "8404:8404" # HAProxy stats page
    healthcheck:
      test: [ "CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg" ]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  demo:

volumes:
  pgsql_patroni_etcd_efcore_demo_etcd1_data:
    driver: local
  pgsql_patroni_etcd_efcore_demo_etcd2_data:
    driver: local
  pgsql_patroni_etcd_efcore_demo_etcd3_data:
    driver: local
  pgsql_patroni_etcd_efcore_demo_patroni1_data:
    driver: local
  pgsql_patroni_etcd_efcore_demo_patroni2_data:
    driver: local
  pgsql_patroni_etcd_efcore_demo_patroni3_data:
    driver: local
