# https://www.haproxy.com/blog/the-four-essential-sections-of-an-haproxy-configuration
# https://www.percona.com/blog/haproxy-patroni-setup-using-health-check-endpoints-and-debugging/
# https://github.com/zalando/spilo/issues/379#issuecomment-647481576
# https://stackoverflow.com/questions/68967624/how-to-access-docker-compose-created-replicas-in-haproxy-config

global
    # global settings here
    # The `maxconn` setting limits the maximum number of connections that HAProxy will accept.
    # Its purpose is to protect your load balancer from running out of memory.
    maxconn 100
    # The `log` setting ensures that warnings emitted during startup and issues that arise during runtime get logged.
    # `stdout` means logs are written to standard output (console/Docker logs), not syslog.
    # `format raw` means the log messages are written as-is, without any additional formatting.
    # `local0` is the syslog facility used to categorize the log messages (required by HAProxy syntax even when logging to stdout).
    log stdout format raw local0

defaults
    # defaults here
    # When operating HAProxy in TCP mode, which is set with `mode tcp`, `timeout server` should be the same as `timeout client`.
    mode tcp
    # The `timeout connect` setting configures the time that HAProxy will wait for a TCP connection to a backend server to be established.
    timeout connect 10s
    # The `timeout client` setting measures inactivity during periods that we would expect the client to be speaking, or in other words sending TCP segments.
    timeout client 30m
    # The `timeout server` setting measures inactivity when we’d expect the backend server to be speaking. When a timeout expires, the connection is closed. 
    timeout server 30m
    # The `timeout check` setting is the amount of time that HAProxy will wait for a response to a health check before it considers the backend server to be down.
    timeout check 5s
    
    # The `log global` setting is a way of telling each subsequent frontend to use the `log` setting that you defined in the `global` section.
    log global
    # The `option tcplog` setting enables logging of TCP connections with full details (client IP, port, timers, connection status).
    # This is recommended when using `mode tcp` (as opposed to `option httplog` which is for HTTP mode).
    option tcplog

resolvers docker_resolver
    nameserver dns1 127.0.0.11:53

# PostgreSQL primary (read-write) - port 5000
frontend postgres_primary
    # a frontend that accepts requests from clients
    # A `bind` setting assigns a listener to a given IP address and port.
    # The IP can be omitted to bind to all IP addresses on the server, and a port can be a single port, a range, or a comma-delimited list.
    bind *:5000
    # Specifies the backend that will be used if the frontend receives a request that does not match any of the defined ACLs (Access Control Lists).
    # Since this frontend does not have any ACLs defined, all incoming requests will be forwarded to the `postgres_primary_backend`.
    default_backend postgres_primary_backend

backend postgres_primary_backend
    # servers that fulfill the requests
    # Enables HTTP health checks even though the backend operates in TCP mode.
    # This works because Patroni exposes a REST API on port 8008 specifically for health checking.
    # HAProxy sends an HTTP GET /primary request to port 8008 to determine which node is the primary,
    # while actual PostgreSQL traffic (port 5432) remains plain TCP.
    option httpchk GET /primary
    # Consider a server healthy if it responds with an HTTP status code of 200 (OK) to the health check request.
    http-check expect status 200
    
    # The `default-server` setting defines default parameters for any server lines that follow.
    # - `inter 3s` means that HAProxy will perform health checks on the backend servers every 3 seconds.
    # - `fall 3` means that if a server fails 3 consecutive health checks (i.e., does not respond with a 200 status code), it will be marked as down.
    # - `rise 2` means that if a server that was previously marked as down responds with a 200 status code for 2 consecutive health checks, it will be marked as up
    # - `on-marked-down shutdown-sessions` means that when a server is marked as down, HAProxy will immediately shut down any existing sessions to that server, ensuring that clients are not connected to an unhealthy server.
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    
    # List all the backend servers that HAProxy will load balance across.
    # - Each server is defined with a name, an address (hostname or IP), and a port number.
    # - The `check port 8008` part tells HAProxy to perform health checks on the specified port (8008) of each server.
    # - The `resolvers docker_resolver` part tells HAProxy to use the `docker_resolver` defined earlier to resolve the hostnames of the backend servers.
    # - The `resolve-prefer ipv4` part tells HAProxy to prefer IPv4
    server patroni1 patroni1:5432 check port 8008 resolvers docker_resolver resolve-prefer ipv4
    server patroni2 patroni2:5432 check port 8008 resolvers docker_resolver resolve-prefer ipv4
    server patroni3 patroni3:5432 check port 8008 resolvers docker_resolver resolve-prefer ipv4

# PostgreSQL replicas (read-only) - port 5001
frontend postgres_replicas
    bind *:5001
    default_backend postgres_replicas_backend

backend postgres_replicas_backend
    # Round-robin distributes read queries evenly across all healthy replicas.
    balance roundrobin

    # Enables HTTP health checks even though the backend operates in TCP mode.
    # HAProxy sends an HTTP GET /replica request to Patroni's REST API on port 8008.
    # Only nodes that are replicas (not primary) will respond with 200 OK.
    option httpchk GET /replica
    # Consider a server healthy if it responds with an HTTP status code of 200 (OK) to the health check request.
    http-check expect status 200

    # - `on-marked-down shutdown-sessions` is intentionally omitted here.
    #   Unlike the primary backend (where a failover means we must immediately drop write connections),
    #   for replicas it's acceptable to let existing read sessions finish naturally.
    #   HAProxy will stop routing NEW connections to a downed replica while existing ones drain out.
    default-server inter 3s fall 3 rise 2
    server patroni1 patroni1:5432 check port 8008 resolvers docker_resolver resolve-prefer ipv4
    server patroni2 patroni2:5432 check port 8008 resolvers docker_resolver resolve-prefer ipv4
    server patroni3 patroni3:5432 check port 8008 resolvers docker_resolver resolve-prefer ipv4

# HAProxy stats page - port 8404
listen stats
    # `listen` section combines the functionality of both `frontend` and `backend` sections, allowing you to define a complete service in one place.
    # Overrides the default `mode tcp` set in the `defaults` section to `mode http`, which is necessary for serving the HAProxy stats page (Web UI).
    mode http
    # The `bind` setting specifies that HAProxy should listen for incoming HTTP requests on port 8404 for the stats page.
    bind *:8404
    # Enable the built-in HAProxy stats page, which provides real-time information about the status of the load balancer and its backend servers.
    stats enable
    # Stats page will be accessible at the root URL (e.g., http://localhost:8404/).
    # If we specify a different URI (e.g., `stats uri /haproxy_stats`), the stats page would be accessible at "http://localhost:8404/haproxy_stats".
    stats uri /
    # Refresh the stats page every 10 seconds to provide up-to-date information about the backend servers and their health status.
    stats refresh 10s
    # Enables HTTP Basic Authentication for the stats page. Format: `stats auth <username>:<password>`.
    # The stats page will require a username and password before it can be accessed.
    # NOTE: The password is stored in plaintext — acceptable for demo/local use only, not for production.
    stats auth haproxy:haproxy


